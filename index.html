<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

            HAND TRACKING CAMERA
        </div>

        <button id="startButton">
            START CAMERA
        </button>

        <div id="errorText"></div>

    </div>

</div>


<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js">
</script>

<script
src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js">
