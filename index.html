<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Paparazzi Hand Camera</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif}
#video{display:none}
#screen{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#drawLayer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#ui{position:fixed;left:16px;top:14px;z-index:3;color:#fff;text-shadow:0 2px 6px #000;font-weight:700}
#help{margin-top:7px;font-size:13px;font-weight:400}
#clear{position:fixed;right:16px;bottom:16px;z-index:4;border:0;border-radius:10px;padding:11px 16px;background:#fff;color:#111;font-weight:700}
#start{position:fixed;inset:0;z-index:10;background:#090909;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.panel{max-width:460px}
.panel h1{font-size:28px;margin:0 0 10px}
.panel p{color:#bbb;line-height:1.5}
button{border:0;border-radius:10px;padding:14px 22px;font-size:17px;font-weight:700;cursor:pointer}
#error{color:#ff7070;white-space:pre-wrap}
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="screen"></canvas>
<canvas id="drawLayer"></canvas>

<div id="ui">
  <div id="mode">DRAWING MODE</div>
  <div id="help"></div>
</div>

<button id="clear">CLEAR</button>

<div id="start">
  <div class="panel">
    <h1>Paparazzi Hand Camera</h1>
    <p>Versi web untuk Android, iPad, dan laptop.<br>Tekan mulai lalu izinkan akses kamera.</p>
    <button id="startBtn">MULAI KAMERA</button>
    <p id="error"></p><p id="status">Memuat sistem...</p>
  </div>
</div>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/+esm";

const video = document.getElementById("video");
const screen = document.getElementById("screen");
const ctx = screen.getContext("2d");
const drawLayer = document.getElementById("drawLayer");
const dctx = drawLayer.getContext("2d");
const start = document.getElementById("start");
const startBtn = document.getElementById("startBtn");
const errorBox = document.getElementById("error");
const startupStatus = document.getElementById("status");
const modeText = document.getElementById("mode");
const helpText = document.getElementById("help");
const clearBtn = document.getElementById("clear");

let W = 1280, H = 720;
let landmarker = null;
let lastVideoTime = -1;

const MODE_DRAW = 0;
const MODE_CAMERA = 1;
let mode = MODE_DRAW;

let transition = false;
let transitionTarget = MODE_DRAW;
let transitionStart = 0;
const transitionDuration = 800;

const brushColors = [
  "#ff3030", "#30ff60", "#3080ff",
  "#00ffff", "#ff00ff", "#ffffff"
];
let brushIndex = 0;
let lastBrushChange = 0;

const effectNames = [
  "BLUR","MOTION BLUR","RGB GLITCH","NEON",
  "INVERSE","PIXELATE","VIGNETTE","CHROMATIC",
  "THERMAL","EDGE","MIRROR","NORMAL"
];
const effectColors = [
  "#ff00ff","#00ffff","#ff3030","#ff00ff",
  "#ffff00","#ffa500","#ffffff","#ff3030",
  "#ff8c00","#00ff55","#00ffff","#00ff55"
];
let effect = 0;
let lastEffectChange = 0;

let lastDrawPoint = null;

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  screen.width = W;
  screen.height = H;
  drawLayer.width = W;
  drawLayer.height = H;
}
window.addEventListener("resize", resize);
resize();

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

function point(hand,index){
  return {
    x: hand[index].x * W,
    y: hand[index].y * H
  };
}

function fingerOpen(hand, tip, pip){
  return hand[tip].y < hand[pip].y;
}

function fiveOpen(hand){
  return (
    fingerOpen(hand,8,6) &&
    fingerOpen(hand,12,10) &&
    fingerOpen(hand,16,14) &&
    fingerOpen(hand,20,18) &&
    Math.abs(hand[4].x-hand[2].x) > 0.10
  );
}

function indexOnly(hand){
  return (
    fingerOpen(hand,8,6) &&
    !fingerOpen(hand,12,10) &&
    !fingerOpen(hand,16,14) &&
    !fingerOpen(hand,20,18) &&
    Math.abs(hand[4].x-hand[2].x) < 0.10
  );
}

function pinch(hand){
  return distance(hand[4],hand[8]) < 0.075;
}

function beginTransition(target){
  if(transition) return;
  transition = true;
  transitionTarget = target;
  transitionStart = performance.now();
  lastDrawPoint = null;
}

function drawBaseVideo(){
  ctx.save();
  ctx.translate(W,0);
  ctx.scale(-1,1);
  ctx.drawImage(video,0,0,W,H);
  ctx.restore();
}

function drawTransition(progress){
  drawBaseVideo();

  const scale = 1 + progress * 0.10;
  ctx.save();
  ctx.translate(W/2,H/2);
  ctx.scale(scale,scale);
  ctx.translate(-W/2,-H/2);
  drawBaseVideo();
  ctx.restore();

  ctx.strokeStyle = "#ff00ff";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(W/2,H/2,progress*450,0,Math.PI*2);
  ctx.stroke();

  ctx.fillStyle = "#00ffff";
  ctx.font = "bold 32px Arial";
  ctx.textAlign = "center";
  ctx.fillText(
    transitionTarget === MODE_CAMERA ? "CAMERA MODE" : "DRAWING MODE",
    W/2,
    H/2 + 12
  );
  ctx.textAlign = "left";
}

function drawMode(hands, now){
  modeText.textContent = "DRAWING MODE";
  modeText.style.color = brushColors[brushIndex];
  helpText.textContent = "5 JARI = CAMERA • PINCH = GANTI WARNA";

  if(hands.length !== 1){
    lastDrawPoint = null;
    ctx.fillStyle = "#00ffff";
    ctx.font = "bold 22px Arial";
    ctx.fillText("SHOW ONE HAND",16,72);
    ctx.drawImage(drawLayer,0,0);
    return;
  }

  const hand = hands[0];
  const index = point(hand,8);

  if(pinch(hand)){
    if(now-lastBrushChange > 800){
      brushIndex = (brushIndex+1) % brushColors.length;
      lastBrushChange = now;
      lastDrawPoint = null;
    }
  }else{
    const p = lastDrawPoint
      ? {
          x:lastDrawPoint.x*0.75+index.x*0.25,
          y:lastDrawPoint.y*0.75+index.y*0.25
        }
      : index;

    if(lastDrawPoint){
      dctx.strokeStyle = brushColors[brushIndex];
      dctx.lineWidth = 8;
      dctx.lineCap = "round";
      dctx.lineJoin = "round";
      dctx.beginPath();
      dctx.moveTo(lastDrawPoint.x,lastDrawPoint.y);
      dctx.lineTo(p.x,p.y);
      dctx.stroke();
    }
    lastDrawPoint = p;
  }

  ctx.drawImage(drawLayer,0,0);

  if(lastDrawPoint){
    ctx.fillStyle = brushColors[brushIndex];
    ctx.beginPath();
    ctx.arc(lastDrawPoint.x,lastDrawPoint.y,10,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function getEffectCanvas(){
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const x = c.getContext("2d");

  x.save();
  x.translate(W,0);
  x.scale(-1,1);
  x.drawImage(video,0,0,W,H);
  x.restore();

  if(effect === 0){
    x.filter = "blur(10px)";
    x.drawImage(c,0,0);
    x.filter = "none";
  }

  if(effect === 1){
    x.filter = "blur(4px)";
    x.globalAlpha = .65;
    x.drawImage(c,18,0);
    x.drawImage(c,-18,0);
    x.globalAlpha = 1;
    x.filter = "none";
  }

  if(effect === 2){
    x.globalAlpha = .75;
    x.drawImage(c,14,0);
    x.drawImage(c,-14,0);
    x.globalAlpha = 1;
  }

  if(effect === 3){
    x.filter = "saturate(250%) contrast(130%)";
    x.drawImage(c,0,0);
    x.filter = "none";
  }

  if(effect === 4){
    const img = x.getImageData(0,0,W,H);
    const a = img.data;
    for(let i=0;i<a.length;i+=4){
      a[i] = 255-a[i];
      a[i+1] = 255-a[i+1];
      a[i+2] = 255-a[i+2];
    }
    x.putImageData(img,0,0);
  }

  if(effect === 5){
    const sw = Math.max(1,Math.floor(W/14));
    const sh = Math.max(1,Math.floor(H/14));
    const small = document.createElement("canvas");
    small.width = sw;
    small.height = sh;
    small.getContext("2d").drawImage(c,0,0,sw,sh);
    x.clearRect(0,0,W,H);
    x.imageSmoothingEnabled = false;
    x.drawImage(small,0,0,W,H);
  }

  if(effect === 6){
    const g = x.createRadialGradient(
      W/2,H/2,Math.min(W,H)*.12,
      W/2,H/2,Math.max(W,H)*.72
    );
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(1,"rgba(0,0,0,.75)");
    x.fillStyle = g;
    x.fillRect(0,0,W,H);
  }

  if(effect === 7){
    x.globalAlpha = .65;
    x.drawImage(c,10,0);
    x.drawImage(c,-10,0);
    x.globalAlpha = 1;
  }

  if(effect === 8){
    x.filter = "grayscale(100%) sepia(100%) hue-rotate(300deg) saturate(400%)";
    x.drawImage(c,0,0);
    x.filter = "none";
  }

  if(effect === 9){
    x.filter = "grayscale(100%) contrast(250%)";
    x.drawImage(c,0,0);
    x.filter = "none";
  }

  if(effect === 10){
    x.save();
    x.translate(W,0);
    x.scale(-1,1);
    x.drawImage(c,0,0);
    x.restore();
  }

  return c;
}

function cameraMode(hands,now){
  modeText.textContent = "PAPARAZZI CAMERA • " + effectNames[effect];
  modeText.style.color = effectColors[effect];
  helpText.textContent = "PINCH = GANTI EFFECT • TELUNJUK = DRAWING";

  drawBaseVideo();

  if(hands.length !== 2){
    ctx.fillStyle = "#00ffff";
    ctx.font = "bold 22px Arial";
    ctx.fillText("SHOW BOTH HANDS",16,72);
    return;
  }

  const a = hands[0];
  const b = hands[1];

  if(pinch(a) || pinch(b)){
    if(now-lastEffectChange > 800){
      effect = (effect+1) % effectNames.length;
      lastEffectChange = now;
    }
  }

  const t1=point(a,4);
  const i1=point(a,8);
  const t2=point(b,4);
  const i2=point(b,8);

  const poly=[t1,t2,i2,i1];
  const effectCanvas=getEffectCanvas();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(poly[0].x,poly[0].y);
  for(const p of poly.slice(1)) ctx.lineTo(p.x,p.y);
  ctx.closePath();
  ctx.clip();
  ctx.drawImage(effectCanvas,0,0);
  ctx.restore();

  ctx.strokeStyle=effectColors[effect];
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(t1.x,t1.y);
  ctx.lineTo(t2.x,t2.y);
  ctx.lineTo(i2.x,i2.y);
  ctx.lineTo(i1.x,i1.y);
  ctx.closePath();
  ctx.stroke();

  for(const hand of [a,b]){
    for(const n of [4,8,12,16,20]){
      const p=point(hand,n);
      ctx.fillStyle=effectColors[effect];
      ctx.beginPath();
      ctx.arc(p.x,p.y,5,0,Math.PI*2);
      ctx.fill();
    }
  }
}

async function setup(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Browser tidak mendukung akses kamera.");
    }

    startBtn.disabled=true;
    startBtn.textContent="MEMUAT...";
    startupStatus.textContent="Memuat MediaPipe...";

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
    );

    startupStatus.textContent="Memuat model hand tracking...";

    landmarker = await HandLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numHands:2,
      minHandDetectionConfidence:.65,
      minHandPresenceConfidence:.65,
      minTrackingConfidence:.75
    });

    startupStatus.textContent="Meminta izin kamera...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    startupStatus.textContent="Kamera siap.";
    start.style.display="none";
    requestAnimationFrame(loop);

  }catch(err){
    console.error(err);
    startBtn.disabled=false;
    startBtn.textContent="COBA LAGI";
    startupStatus.textContent="Gagal memulai.";
    errorBox.textContent =
      "Kamera gagal dibuka.\n" +
      "Pastikan website dibuka lewat HTTPS dan izin kamera diberikan.\n\n" +
      err.message;
  }
}

function loop(now){
  if(video.readyState < 2){
    requestAnimationFrame(loop);
    return;
  }

  if(video.currentTime !== lastVideoTime){
    const result = landmarker.detectForVideo(video,now);
    lastVideoTime=video.currentTime;
    const hands=result.landmarks || [];

    if(!transition){
      if(mode===MODE_DRAW && hands.length===1 && fiveOpen(hands[0])){
        beginTransition(MODE_CAMERA);
      }else if(mode===MODE_CAMERA && hands.length===1 && indexOnly(hands[0])){
        beginTransition(MODE_DRAW);
      }
    }

    if(transition){
      const progress=Math.min(
        (now-transitionStart)/transitionDuration,
        1
      );
      drawTransition(progress);

      if(progress>=1){
        mode=transitionTarget;
        transition=false;
        lastDrawPoint=null;
      }
    }else{
      if(mode===MODE_DRAW) drawMode(hands,now);
      else cameraMode(hands,now);
    }
  }

  requestAnimationFrame(loop);
}

clearBtn.addEventListener("click",()=>{
  dctx.clearRect(0,0,drawLayer.width,drawLayer.height);
  lastDrawPoint=null;
});

startBtn.addEventListener("click",setup);
</script>
</body>
</html>
